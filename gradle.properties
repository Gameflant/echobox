org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.daemon=false
org.gradle.caching=true

# 环境：aapt2 走本地包装（系统无 dl.google.com）
android.aapt2FromMavenOverride=/opt/forgebuild/bin/aapt2
android.builder.sdkDownload=false
android.suppressUnsupportedCompileSdk=37

android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9 内置 Kotlin 为 2.2.10，无法读取 Miuix 0.9.4（Kotlin 2.4）的 metadata
android.builtInKotlin=false
android.newDsl=false
